<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlazorApp2</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- MarkerCluster CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/variables.css" />
    <!-- Leaflet CSS — REQUIRED for map tiles to render -->


    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="js/mapInterop.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/detail-map.js"></script>
    <script src="js/live-map.js"></script>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="BlazorApp2.styles.css" rel="stylesheet" />
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="splash-screen">
            <div class="splash-ring">
                <svg class="loading-progress" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="44" />
                    <circle cx="50" cy="50" r="44" />
                </svg>
                <span class="splash-icon">
                    <i class="fa-solid fa-shield-halved"></i>
                </span>
            </div>
            <div class="splash-brand">
                <span style="--i:0">E</span><span style="--i:1">G</span><span style="--i:2">H</span><span style="--i:3">A</span><span style="--i:4">T</span><span style="--i:5">H</span><span style="--i:6">A</span>
            </div>
            <div class="splash-tagline">Coordinating relief, in real time</div>
            <div class="loading-progress-text"><span></span><span></span><span></span></div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
